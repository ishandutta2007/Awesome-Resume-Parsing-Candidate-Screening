<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- SVG Filters for Lighting & Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Subtle CSS Keyframe Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatDelayed {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 400; opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes rotateRadar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes scanVertical {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(90px); opacity: 0.2; }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      .floating-node-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-node-2 { animation: floatDelayed 9s ease-in-out infinite; }
      .pulse-stream {
        stroke-dasharray: 80, 120;
        animation: pulseBeam 5s linear infinite;
      }
      .scanner-beam {
        animation: scanVertical 3.5s ease-in-out infinite;
      }
      .badge-glow {
        animation: badgePulse 4s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="356" x="2" y="2" rx="15" fill="none" stroke="url(#primaryGlow)" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Geometric Grid Pattern (Background Decoration) -->
  <g opacity="0.12">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,6" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,6" />
  </g>

  <!-- Dynamic / Animated Flow Streams (Subtle Background Nodes) -->
  <g class="pulse-stream" fill="none" stroke="url(#primaryGlow)" stroke-width="2">
    <path d="M 40,90 Q 220,40 380,90 T 720,80 T 1140,90" />
    <path d="M 60,280 Q 260,330 460,280 T 860,290 T 1160,270" stroke-opacity="0.6" />
  </g>

  <!-- Left Dynamic Element: Resume Document Scanner (Underneath / Left decorative area) -->
  <g class="floating-node-1" transform="translate(60, 85)" filter="url(#shadow)">
    <!-- Document Card Container -->
    <rect width="140" height="180" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" />
    
    <!-- Document Header & Lines -->
    <rect x="18" y="22" width="40" height="8" rx="4" fill="#38bdf8" fill-opacity="0.8" />
    <circle cx="112" cy="26" r="12" fill="#818cf8" fill-opacity="0.25" stroke="#818cf8" stroke-width="1.5" />
    <path d="M 18,48 L 122,48 M 18,62 L 95,62 M 18,76 L 115,76 M 18,90 L 80,90 M 18,104 L 110,104 M 18,118 L 100,118 M 18,132 L 65,132" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    
    <!-- Laser Scan Beam Effect -->
    <g class="scanner-beam">
      <line x1="12" y1="42" x2="128" y2="42" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)" />
      <polygon points="12,42 128,42 120,54 20,54" fill="#38bdf8" fill-opacity="0.18" />
    </g>

    <!-- Mini Extracted Entity Tags -->
    <rect x="16" y="148" width="48" height="18" rx="4" fill="#38bdf8" fill-opacity="0.25" />
    <text x="40" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#7dd3fc" text-anchor="middle">SKILLS</text>
    <rect x="70" y="148" width="54" height="18" rx="4" fill="#a855f7" fill-opacity="0.25" />
    <text x="97" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#d8b4fe" text-anchor="middle">MATCH 98%</text>
  </g>

  <!-- Right Dynamic Element: AI Screening Radar & Score Gauge -->
  <g class="floating-node-2" transform="translate(980, 85)" filter="url(#shadow)">
    <!-- Candidate Screening Dashboard Card -->
    <rect width="160" height="180" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1.5" />
    
    <!-- Circular Match Score Gauge -->
    <circle cx="80" cy="75" r="42" fill="none" stroke="#334155" stroke-width="7" />
    <circle cx="80" cy="75" r="42" fill="none" stroke="url(#primaryGlow)" stroke-width="7" stroke-dasharray="210, 264" stroke-linecap="round" transform="rotate(-90 80 75)" filter="url(#glow)" />
    
    <text x="80" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle">96.8%</text>
    <text x="80" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">ATS FIT</text>

    <!-- Mini Criteria Metrics Bars -->
    <g transform="translate(20, 130)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Semantic NLP</text>
      <rect x="75" y="3" width="45" height="6" rx="3" fill="#1e293b" />
      <rect x="75" y="3" width="42" height="6" rx="3" fill="#38bdf8" />

      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Bias Audit</text>
      <rect x="75" y="21" width="45" height="6" rx="3" fill="#1e293b" />
      <rect x="75" y="21" width="40" height="6" rx="3" fill="#a855f7" />
    </g>
  </g>

  <!-- Center Foreground Content: Clean, Crisp Title and Subtitles (High z-index) -->
  <g transform="translate(600, 0)">
    <!-- Top Pill / Badge -->
    <g class="badge-glow" transform="translate(0, 52)">
      <rect x="-140" y="0" width="280" height="30" rx="15" fill="#1e293b" stroke="url(#primaryGlow)" stroke-width="1.2" />
      <circle cx="-116" cy="15" r="5" fill="#38bdf8" filter="url(#glow)" />
      <text x="5" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="1.5">⚡ CURATED RECRUITMENT TECH</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5">
      Awesome Resume Parsing &amp;
    </text>
    <text x="0" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="34" font-weight="900" fill="url(#primaryGlow)" text-anchor="middle" letter-spacing="-0.5">
      Candidate Screening
    </text>

    <!-- Subtitle & Key Pillars -->
    <text x="0" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#cbd5e1" text-anchor="middle">
      Open-Source Engines • Layout-Aware LLMs • Enterprise SaaS • Bias-Audited ATS
    </text>

    <!-- Feature Feature Tag Pills in Foreground -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <g transform="translate(-190, 0)">
        <rect x="0" y="0" width="118" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
        <text x="59" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#93c5fd" text-anchor="middle">📄 NER &amp; OCR</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-60, 0)">
        <rect x="0" y="0" width="124" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
        <text x="62" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c7d2fe" text-anchor="middle">🎯 JD Matching</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(74, 0)">
        <rect x="0" y="0" width="120" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
        <text x="60" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e9d5ff" text-anchor="middle">🛡️ PII Stripping</text>
      </g>
    </g>

    <!-- Repository Metadata Stats -->
    <text x="0" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle">
      Maintained for Talent Acquisition Teams, ML Engineers &amp; HR Tech Architects
    </text>
  </g>
</svg>
